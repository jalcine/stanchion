name: Site

# Publishes the project site to the `gh-pages` branch.
#
# This exists because publishing was a manual step with nothing to prompt it, and the
# site drifted from the documentation for three weeks without anyone noticing: the
# `registry` guide was stale from 20 September and `bindings`/`remote` from the 30th.
# The guides are rendered from `docs/*.md`, so the thing that goes out of date is the
# render, not the writing.
#
# Only on `main`, and only when the inputs change: the guides themselves, or the
# generator and the assets it copies. A push that touches neither cannot change the
# output, so there is nothing to publish.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'tools/site/**'
      - '.github/workflows/site.yml'
  # So a publish can be forced after something the paths filter cannot see — a Pages
  # setting, or a branch repaired by hand.
  workflow_dispatch:

# Two pushes in quick succession would otherwise race each other pushing to the same
# branch, and the loser fails on a non-fast-forward. Not cancel-in-progress: a half
# finished publish is worse than a redundant one.
concurrency:
  group: site
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          install_args: rust

      - uses: Swatinem/rust-cache@v2
        with:
          key: site

      # Through mise, so this and a local `mise run site` cannot generate differently.
      - name: Generate
        run: mise run site

      # A second checkout rather than a branch switch: `gh-pages` is an orphan branch
      # with none of the source in it, and checking it out over the working tree would
      # leave the build directory stranded beside it.
      - name: Check out gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: .gh-pages

      # `--delete` so a guide removed from `docs/` disappears from the site too, and
      # `--exclude .git` so the checkout's own metadata survives it. The generator
      # emits the whole tree, so what it does not write should not be there.
      - name: Stage the generated site
        run: rsync -a --delete --exclude .git site-out/ .gh-pages/

      - name: Publish
        working-directory: .gh-pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          # Nothing to say if nothing rendered differently. A docs change that only
          # touches prose the generator drops would otherwise land an empty commit
          # every time.
          if git diff --cached --quiet; then
            echo 'site is already current; nothing to publish'
            exit 0
          fi
          git commit -m "site: regenerate from ${GITHUB_SHA::12}

          Generated by .github/workflows/site.yml from $GITHUB_REF_NAME."
          git push origin gh-pages

[workspace]
resolver = "3"
# `bindings/*` are the foreign-language shims. They are workspace members so one
# lockfile and one `cargo clippy` cover them, but not default members: building
# them needs a Python, Ruby or Node toolchain that a Rust-only checkout will not
# have, and `cargo test` should not start demanding one.
members = ["crates/*", "bindings/*", "tools/*"]
default-members = ["crates/*", "tools/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jalcine/stanchion"

[workspace.dependencies]
stanchion-abi = { path = "crates/stanchion-abi", version = "0.1.0", features = ["lua"] }
stanchion-dist = { path = "crates/stanchion-dist", version = "0.1.0" }
stanchion-ffi = { path = "crates/stanchion-ffi", version = "0.1.0" }
stanchion-index = { path = "crates/stanchion-index", version = "0.1.0" }
stanchion-index-poem = { path = "crates/stanchion-index-poem", version = "0.1.0" }
stanchion-lua = { path = "crates/stanchion-lua", version = "0.1.0" }
stanchion-macros = { path = "crates/stanchion-macros", version = "0.1.0" }
stanchion-registry = { path = "crates/stanchion-registry", version = "0.1.0" }
stanchion-remote = { path = "crates/stanchion-remote", version = "0.1.0" }
stanchion-sigstore = { path = "crates/stanchion-sigstore", version = "0.1.0" }
stanchion-wasm = { path = "crates/stanchion-wasm", version = "0.1.0" }

mlua = { version = "0.12", default-features = false, features = ["lua54", "vendored"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = { version = "1", features = ["serde"] }
sha2 = "0.10"
toml = "0.9"
jsonrpsee-types = "0.26"
http = "1"
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1", features = ["full"] }
tempfile = "3"

# The panic policy, in one place so it cannot drift between crates: every fallible
# path returns an error instead of unwinding into a caller.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"

[package]
name = "stanchion-godot"
description = "Godot 4 (GDExtension) bindings for stanchion: sandboxed Lua plugins with capabilities and signatures, callable from GDScript"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
# GDExtension loads a plain C dynamic library. `rlib` as well so the crate can be
# unit-tested with `cargo test` without an editor in the loop.
crate-type = ["cdylib", "rlib"]

[dependencies]
stanchion-ffi = { workspace = true, features = ["signatures"] }
godot = "0.5"

[features]
# Lua 5.4, built from source, so the extension ships without a system Lua. Turn this
# off and name another to link the interpreter the host already embeds.
default = ["lua54", "vendored"]
lua54 = ["stanchion-ffi/lua54"]
lua53 = ["stanchion-ffi/lua53"]
luajit = ["stanchion-ffi/luajit"]
luau = ["stanchion-ffi/luau"]
vendored = ["stanchion-ffi/vendored"]

[lints]
workspace = true

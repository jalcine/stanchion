[package]
name = "stanchion-ruby"
description = "Ruby bindings for stanchion: Lua plugins with sandboxing, capabilities and signatures"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
# Ruby requires the extension's shared object to match the module it defines, so this
# lib has to be called `stanchion` — which collides with the `stanchion` facade crate
# when rustdoc writes them both to the same path, breaking `cargo doc --workspace`.
# There is no Rust API here worth rustdoc anyway: the surface is the Ruby one in
# `lib/stanchion.rb`.
doc = false
name = "stanchion"
crate-type = ["cdylib", "rlib"]

[dependencies]
stanchion-ffi = { workspace = true, features = ["async", "signatures"] }
magnus = "0.8"
futures-executor = { version = "0.3", default-features = false, features = ["std"] }

[features]
default = ["lua54", "vendored"]
lua54 = ["stanchion-ffi/lua54"]
lua53 = ["stanchion-ffi/lua53"]
luajit = ["stanchion-ffi/luajit"]
luau = ["stanchion-ffi/luau"]
vendored = ["stanchion-ffi/vendored"]

[lints]
workspace = true

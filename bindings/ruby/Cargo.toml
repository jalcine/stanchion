[package]
name = "stanchion-ruby"
description = "Ruby bindings for stanchion: Lua plugins with sandboxing, capabilities and signatures"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "stanchion"
crate-type = ["cdylib", "rlib"]

[dependencies]
stanchion-ffi = { workspace = true, features = ["async", "signatures"] }
magnus = "0.8"
futures-executor = { version = "0.3", default-features = false, features = ["std"] }

[features]
default = ["lua54", "vendored"]
lua54 = ["stanchion-ffi/lua54"]
lua53 = ["stanchion-ffi/lua53"]
luajit = ["stanchion-ffi/luajit"]
luau = ["stanchion-ffi/luau"]
vendored = ["stanchion-ffi/vendored"]

[lints]
workspace = true

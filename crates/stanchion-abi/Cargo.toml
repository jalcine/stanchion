[package]
name = "stanchion-abi"
description = "Runtime-agnostic types shared by the Lua and WASM plugin backends"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
semver.workspace = true
toml.workspace = true
mlua = { workspace = true, optional = true }

[features]
default = []
# The Lua-specific conversions (`Value::to_lua` / `Value::from_lua`, and
# `From<mlua::Error> for Error`). Off by default so a WASM-only build links no Lua.
lua = ["dep:mlua"]

[lints]
workspace = true

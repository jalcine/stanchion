[package]
name = "stanchion-dist"
description = "Secure plugin distribution for stanchion: packages, a signed index, and pinned installs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
stanchion-registry = { workspace = true, features = ["signatures"] }
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
toml.workspace = true
time = { version = "0.3", features = ["parsing", "formatting"] }

flate2 = { version = "1", optional = true }
tar = { version = "0.4", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking"], optional = true }

[features]
default = []
# Reading and writing the on-the-wire plugin package (a tar.gz of the directory).
package = ["dep:tar", "dep:flate2"]
# Reading an index and fetching packages over HTTPS.
http = ["package", "dep:reqwest"]
# Everything a host needs to install from a remote index.
client = ["http"]

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
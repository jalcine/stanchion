[package]
name = "stanchion-ffi"
description = "Language-neutral dynamic facade for stanchion, for building foreign-language bindings"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# The runtime trait replaces direct `&Lua` usage; lua-enabled bindings use stanchion-lua
stanchion-registry = { workspace = true, features = ["config", "send", "signatures"] }
stanchion-abi = { workspace = true, features = ["lua"] }
stanchion-lua = { workspace = true }
serde.workspace = true
toml.workspace = true

futures-executor = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1", default-features = false, features = ["sync"] }

[features]
default = ["signatures"]
async = ["stanchion-registry/async", "stanchion-lua/async"]
signatures = ["stanchion-registry/signatures"]
lua54 = ["stanchion-lua/lua54"]
lua53 = ["stanchion-lua/lua53"]
luajit = ["stanchion-lua/luajit"]
luau = ["stanchion-lua/luau"]
vendored = ["stanchion-lua/vendored"]

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["test-util", "rt-multi-thread"] }

[lints]
workspace = true
[package]
name = "stanchion-index-poem"
description = "Poem adapter for serving a stanchion plugin index"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
stanchion-index = { workspace = true, features = ["stream"] }
poem = "3"
tokio = { version = "1", features = ["rt"] }

[features]
default = []

[dev-dependencies]
stanchion-dist = { workspace = true, features = ["client"] }
poem = { version = "3", features = ["server"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
tempfile = "3"
semver.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

[lints]
workspace = true

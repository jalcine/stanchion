[package]
name = "stanchion-index"
description = "Serve a stanchion plugin index over HTTP, independent of any web framework"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
stanchion-dist = { workspace = true, features = ["package"] }
http.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
time.workspace = true
tower-service = { version = "0.3", optional = true }
bytes = { version = "1", optional = true }
tokio = { version = "1", default-features = false, features = ["rt", "sync"], optional = true }
tokio-stream = { version = "0.1", optional = true }
http-body-util = { version = "0.1", optional = true }
http-body = { version = "1", optional = true }
futures-util = { version = "0.3", default-features = false, optional = true }

[features]
default = []
# Streaming a package from a synchronous reader, so serving one costs a buffer
# rather than its own size in memory. Both adapters use it.
stream = ["dep:bytes", "dep:tokio", "dep:tokio-stream"]
# A `tower::Service`, so axum, tonic and warp can mount the index directly.
tower = ["stream", "dep:tower-service", "dep:http-body-util", "dep:http-body", "dep:futures-util"]
lua54 = ["stanchion-dist/lua54"]
lua53 = ["stanchion-dist/lua53"]
luajit = ["stanchion-dist/luajit"]
luau = ["stanchion-dist/luau"]
vendored = ["stanchion-dist/vendored"]

[dev-dependencies]
tempfile = "3"
serde_json.workspace = true
time = { workspace = true }
stanchion-dist = { workspace = true, features = ["package"] }

[lints]
workspace = true

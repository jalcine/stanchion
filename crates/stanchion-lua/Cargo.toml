[package]
name = "stanchion-lua"
description = "Lua-specific implementation of the stanchion plugin system"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
exclude.workspace = true

[dependencies]
stanchion-abi = { workspace = true }
mlua = { workspace = true, default-features = false, features = ["serde", "send"] }
stanchion-macros = { workspace = true }
serde.workspace = true
toml.workspace = true
# Only the `sync` feature, and only under `async`: the async call path needs a mutex
# whose guard is `Send` so it can be held across an await (see `SharedState::gate`).
tokio = { version = "1", features = ["sync"], optional = true }

[features]
default = ["lua54"]
async = ["mlua/async", "dep:tokio"]
lua54 = ["mlua/lua54"]
lua53 = ["mlua/lua53"]
luajit = ["mlua/luajit"]
luau = ["mlua/luau"]
vendored = ["mlua/vendored"]

# The workspace panic policy applies here too. This crate — the largest in the
# workspace and the one that actually drives a VM — was exempt from it, which is
# exactly the drift the policy lives at the workspace root to prevent.
[lints]
workspace = true
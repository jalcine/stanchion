[package]
name = "stanchion-registry"
description = "Plugin registry for stanchion: manifests, sandboxing, capabilities, reload"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
mlua = { workspace = true, default-features = false, features = ["serde", "send"] }
stanchion-abi.workspace = true
stanchion-lua = { workspace = true }
semver.workspace = true
serde.workspace = true
toml.workspace = true
sha2 = { workspace = true, optional = true }
stanchion-rocks = { workspace = true, optional = true }

[features]
default = []
config = []
async = ["mlua/async", "stanchion-lua/async"]
send = []  # mlua/send is always on, this is a no-op feature for compatibility
luarocks = ["dep:stanchion-rocks"]
signatures = ["dep:sha2"]
lua54 = ["mlua/lua54"]
lua53 = ["mlua/lua53"]
luajit = ["mlua/luajit"]
luau = ["mlua/luau"]
vendored = ["mlua/vendored"]

[lints]
workspace = true
[package]
name = "stanchion-remote"
description = "Out-of-process plugin hosting for stanchion, over length-prefixed JSON"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
exclude.workspace = true

[dependencies]
stanchion-abi.workspace = true
stanchion-lua = { workspace = true }
stanchion-registry = { workspace = true }
serde.workspace = true
serde_json.workspace = true
jsonrpsee-types.workspace = true
toml.workspace = true

[[bin]]
name = "plugin-host-lua"
path = "src/bin/plugin_host_lua.rs"
required-features = ["lua-backend"]

[[bin]]
name = "plugin-host-wasm"
path = "src/bin/plugin_host_wasm.rs"
required-features = ["wasm-backend"]

[features]
default = []
lua-backend = ["stanchion-lua/lua54"]
wasm-backend = []
async = ["stanchion-lua/async"]
luarocks = ["stanchion-registry/luarocks"]
signatures = ["stanchion-registry/signatures"]
lua54 = ["stanchion-lua/lua54"]
lua53 = ["stanchion-lua/lua53"]
luajit = ["stanchion-lua/luajit"]
luau = ["stanchion-lua/luau"]
vendored = ["stanchion-lua/vendored"]

[lints]
workspace = true

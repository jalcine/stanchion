[package]
name = "stanchion-remote"
description = "Out-of-process plugin hosting for stanchion, over length-prefixed JSON"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
mlua = { workspace = true, features = ["serde"] }
stanchion-abi.workspace = true
stanchion-registry = { workspace = true, features = ["config"] }
serde.workspace = true
serde_json.workspace = true
jsonrpsee-types.workspace = true
toml.workspace = true

[[bin]]
name = "plugin-host-lua"
path = "src/bin/plugin_host_lua.rs"
required-features = ["lua-backend"]

[[bin]]
name = "plugin-host-wasm"
path = "src/bin/plugin_host_wasm.rs"
required-features = ["wasm-backend"]

[features]
default = []
lua-backend = ["mlua/lua54", "stanchion-abi/lua"]
wasm-backend = []
async = ["stanchion-registry/async"]
luarocks = ["stanchion-registry/luarocks"]
signatures = ["stanchion-registry/signatures"]
lua54 = ["mlua/lua54"]
lua53 = ["mlua/lua53"]
luajit = ["mlua/luajit"]
luau = ["mlua/luau"]
vendored = ["mlua/vendored"]

[lints]
workspace = true

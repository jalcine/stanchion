[package]
name = "stanchion-sigstore"
description = "Sigstore-backed plugin signature verification for stanchion"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
mlua.workspace = true
stanchion-registry = { workspace = true, features = ["signatures"] }
serde_json.workspace = true
sha2.workspace = true
sigstore = { version = "0.14", default-features = false, features = [
    "verify",
    "sigstore-trust-root",
    "rustls-tls",
] }

[features]
default = []
send = ["stanchion-registry/send"]
lua54 = ["mlua/lua54"]
lua53 = ["mlua/lua53"]
luajit = ["mlua/luajit"]
luau = ["mlua/luau"]
vendored = ["mlua/vendored"]

[lints]
workspace = true

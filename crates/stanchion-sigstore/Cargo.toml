[package]
name = "stanchion-sigstore"
description = "Sigstore-backed plugin signature verification for stanchion"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
stanchion-registry = { workspace = true, features = ["signatures"] }
serde_json.workspace = true
sha2.workspace = true
sigstore = { version = "0.14", default-features = false, features = [
    "verify",
    "sigstore-trust-root",
    "rustls-tls",
] }
x509-parser = "0.16"

[features]
default = []
send = ["stanchion-registry/send"]

[lints]
workspace = true

[package]
name = "stanchion-sigstore"
description = "Sigstore-backed plugin signature verification for stanchion"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
exclude.workspace = true

[dependencies]
stanchion-registry = { workspace = true, features = ["signatures"] }
serde_json.workspace = true
# 0.10, not the workspace 0.11: sigstore 0.14's `verify_digest` takes this
# version's `Sha256`, and the hasher here exists only to feed it.
sha2 = "0.10"
sigstore = { version = "0.14", default-features = false, features = [
    "verify",
    "sigstore-trust-root",
    "rustls-tls",
] }
x509-parser = "0.16"
sigstore_protobuf_specs = "0.5.2"

[features]
default = []
send = ["stanchion-registry/send"]

[lints]
workspace = true

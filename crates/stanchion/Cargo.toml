[package]
name = "stanchion"
description = "Lua plugins for Rust applications: typed contracts, sandboxing, capabilities, signatures"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
exclude.workspace = true

[[bin]]
name = "plugin-host"
path = "src/bin/plugin_host.rs"
required-features = ["remote"]

# Examples declare what they need, so `cargo build --examples` skips the ones a
# given feature set cannot build instead of failing.
[[example]]
name = "greeter"
required-features = []

[[example]]
name = "event_bus"
required-features = ["registry"]

[[example]]
name = "untrusted"
required-features = ["registry"]

[[example]]
name = "remote_host"
required-features = ["remote"]

[[example]]
name = "signed"
required-features = ["signatures"]

[[example]]
name = "hot_reload"
required-features = ["registry"]

[[example]]
name = "pinned"
required-features = ["signatures"]

[[example]]
name = "rocks"
required-features = ["luarocks"]

[dependencies]
stanchion-dist = { workspace = true, optional = true }
stanchion-index = { workspace = true, optional = true }
stanchion-abi = { workspace = true }
stanchion-lua = { workspace = true, optional = true }
stanchion-registry = { workspace = true, optional = true }
stanchion-remote = { workspace = true, optional = true }
stanchion-sigstore = { workspace = true, optional = true }

[features]
send = []
default = []
async = ["dep:stanchion-lua", "stanchion-lua/async"]
registry = ["dep:stanchion-registry", "dep:stanchion-lua"]
lua54 = ["dep:stanchion-lua", "stanchion-lua/lua54"]
lua53 = ["dep:stanchion-lua", "stanchion-lua/lua53"]
luajit = ["dep:stanchion-lua", "stanchion-lua/luajit"]
luau = ["dep:stanchion-lua", "stanchion-lua/luau"]
vendored = ["dep:stanchion-lua", "stanchion-lua/vendored"]
luarocks = ["registry", "stanchion-registry/luarocks"]
signatures = ["registry", "stanchion-registry/signatures"]
sigstore-verify = ["signatures", "dep:stanchion-sigstore"]
remote = ["registry", "dep:stanchion-remote"]
distribution = ["signatures", "dep:stanchion-dist", "stanchion-dist/package"]
distribution-client = ["distribution", "stanchion-dist/client"]
index-server = ["distribution", "dep:stanchion-index"]
full = ["async", "registry", "luarocks", "signatures", "remote", "distribution"]

[dev-dependencies]
stanchion-lua = { workspace = true }
serde_json.workspace = true
tokio = { version = "1", features = ["rt", "macros", "time"] }
trybuild = "1"
tempfile = "3"
tar = "0.4"
flate2 = "1"

[package.metadata.docs.rs]
features = ["async", "registry", "luarocks", "signatures", "remote"]

[lints]
workspace = true
[package]
name = "stanchion"
description = "Lua plugins for Rust applications: typed contracts, sandboxing, capabilities, signatures"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "plugin-host"
path = "src/bin/plugin_host.rs"
required-features = ["remote"]

# Examples declare what they need, so `cargo build --examples` skips the ones a
# given feature set cannot build instead of failing.
[[example]]
name = "greeter"
required-features = []

[[example]]
name = "event_bus"
required-features = ["registry"]

[[example]]
name = "untrusted"
required-features = ["registry"]

[[example]]
name = "remote_host"
required-features = ["remote"]

[dependencies]
mlua.workspace = true
stanchion-core.workspace = true
stanchion-dist = { workspace = true, optional = true }
stanchion-registry = { workspace = true, optional = true }
stanchion-remote = { workspace = true, optional = true }
stanchion-rocks = { workspace = true, optional = true }
stanchion-sigstore = { workspace = true, optional = true }

[features]
default = []
async = ["stanchion-core/async", "stanchion-registry?/async", "stanchion-remote?/async"]
send = ["stanchion-core/send", "stanchion-registry?/send", "stanchion-remote?/send"]
registry = ["dep:stanchion-registry"]
luarocks = ["registry", "dep:stanchion-rocks", "stanchion-registry/luarocks"]
signatures = ["registry", "stanchion-registry/signatures"]
sigstore-verify = ["signatures", "dep:stanchion-sigstore"]
remote = ["registry", "dep:stanchion-remote"]

# Packaging and installing plugins with a pinned lockfile. Adds tar and gzip, and no
# network stack: an install from a directory of packages needs nothing more.
distribution = ["signatures", "dep:stanchion-dist", "stanchion-dist/package"]
# Fetching from an OCI registry and reading an index over HTTPS. Quarantined behind
# its own feature because it is where the HTTP and TLS dependencies arrive.
distribution-client = ["distribution", "stanchion-dist/client"]

# Everything testable without the sigstore dependency graph. Integration tests are
# gated per feature, so a run without this silently covers almost nothing.
full = ["async", "send", "registry", "luarocks", "signatures", "remote", "distribution"]
lua54 = ["mlua/lua54", "stanchion-core/lua54"]
lua53 = ["mlua/lua53", "stanchion-core/lua53"]
luajit = ["mlua/luajit", "stanchion-core/luajit"]
luau = ["mlua/luau", "stanchion-core/luau"]
vendored = ["mlua/vendored", "stanchion-core/vendored"]

[dev-dependencies]
mlua = { workspace = true, features = ["serde"] }
serde_json.workspace = true
tokio = { version = "1", features = ["rt", "macros", "time"] }
trybuild = "1"
tempfile = "3"
tar = "0.4"
flate2 = "1"

[package.metadata.docs.rs]
features = ["lua54", "vendored", "async", "send", "registry", "luarocks", "signatures", "remote"]

[lints]
workspace = true

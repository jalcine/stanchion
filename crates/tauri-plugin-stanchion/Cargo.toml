[package]
name = "tauri-plugin-stanchion"
description = "Plugin discovery for Tauri applications using stanchion"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
exclude.workspace = true

[dependencies]
tauri = { version = "2", features = [] }
async-trait = "0.1"
stanchion-abi = { workspace = true }
stanchion-remote = { workspace = true }
toml = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
semver = { workspace = true, features = ["serde"] }
thiserror = "1.0"
tokio = { workspace = true, features = ["full"] }
fs-err = "3.3.1"

[features]
default = []

# The workspace panic policy applies here too; this crate was exempt from it.
[lints]
workspace = true

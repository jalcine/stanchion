[package]
name = "dev-harness"
description = "Development harness example: watch a plugin directory, reload on change, smoke-test"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
exclude.workspace = true

[[bin]]
name = "harness-watch"
path = "src/main.rs"

[dependencies]
stanchion-registry = { workspace = true, features = ["signatures"] }
stanchion-lua = { workspace = true, features = ["lua54", "vendored"] }

[lints]
workspace = true

# Toolchains for working on stanchion.
#
# The Rust crates need only Rust. Everything else here exists because
# `bindings/*` targets a language with its own toolchain, and a version drift
# between what a developer runs and what CI runs shows up as a binding that
# builds for one of them and not the other.
#
#   mise install        # fetch everything below
#   mise run test       # the Rust suite
#   mise run smoke      # the generated bindings, end to end
#
# Lua is not here: `mlua`'s `vendored` feature builds it from source, which is
# what lets a published wheel or gem need nothing present on the system. See
# docs/bindings.md for linking an interpreter the application already has.

[tools]
# Edition 2024, and the workspace lints deny enough that a version bump can
# start failing a build. Pinned rather than floating for that reason.
rust = "1.97.0"
"cargo:cargo-nextest" = "0.9.115"
"cargo:cargo-tarpaulin" = "0.37"
"godot" = "4.7.2-stable"

# bindings/python: `uv` drives everything, and builds the extension through
# maturin, which it installs itself from pyproject.toml's build-system.
python = "3.14.2"
uv = "latest"

# examples/chess: gdtoolkit (Scony/godot-gdscript-toolkit) provides gdlint and
# gdformat for the Godot scripts. Pinned: the 4.x line targets Godot 4, and a
# parser bump can reformat or re-lint the whole example. Via pipx rather than
# the uv backend, whose vfox plugin fails to load on this mise version.
"pipx:gdtoolkit" = "4.5.0"

# bindings/uniffi: Kotlin compiles the generated bindings, Java runs them under
# JNA, and uniffi-bindgen shells out to ktlint to format what it generates —
# without it, generation warns and emits unformatted Kotlin.
java = "20.0.2"
kotlin = "2.2.20"
"aqua:ktlint" = "1.8.0"

# examples/kotlin-android-app: mise-pinned Android toolchain. The NDK itself
# comes from sdkmanager (pinned below via ANDROID_NDK_VERSION), so mise only
# pins the SDK command-line tools and the Rust NDK driver.
android-sdk = "23.0"
"cargo:cargo-ndk" = "4.1.2"
gradle = "8.9"

# bindings/ruby, and bindings/node once it is written. Pinned so the versions a
# binding is built against are a decision rather than whatever happened to be on the
# machine that day.
#
# Ruby is 3.3 rather than 4.0 because `magnus` and `rb-sys` target the 3.x line and a
# native extension is what a major release breaks. 4.0 does in fact build and pass,
# so this is a floor for what is tested, not a ceiling on what works.
ruby = "3.3.12"
node = "26.3.0"
jj = "0.45.1"

# Swift is deliberately absent. The bindings generate on any platform but can
# only be compiled and run where a Swift toolchain exists, which for this
# project means macOS; mise would install one here and then have nothing to do.

[env]
# Pinned by `android:build:ffi` via sdkmanager; minimal ABI set is arm64-v8a
# (device) + x86_64 (emulator). LTS r27d; keep in sync with app/build.gradle.kts.
ANDROID_NDK_VERSION = "27.3.13750724"
ANDROID_API = "34"

# The feature set `test` and `lint` share.
#
# One variable rather than two literals because they drifted: `lint` carried only
# the `stanchion/*` features, so anything behind a `stanchion-ffi` feature — the
# signature-gated tests among them — compiled in the suite but was never linted.
# A feature added to one of these tasks and not the other is the bug this prevents.
STANCHION_FEATURES = "stanchion/full,stanchion/lua54,stanchion/vendored,stanchion-ffi/lua54,stanchion-ffi/vendored,stanchion-ffi/signatures,stanchion-ffi/async"

[tasks.test]
description = "Run the Rust suite under nextest"
run = "cargo nextest run --workspace --features $STANCHION_FEATURES"

[tasks."test:doc"]
description = "Doctests, which nextest does not run"
run = "cargo test --doc --workspace --features $STANCHION_FEATURES"

[tasks."test:coverage"]
description = "Run test suite with coverage via cargo-tarpaulin"
run = "cargo tarpaulin --workspace --features $STANCHION_FEATURES --out Html --out Lcov --output-dir target/coverage --timeout 300"

[tasks."test:coverage:quick"]
description = "Quick coverage (excludes slow suites)"
run = "cargo tarpaulin --workspace --features $STANCHION_FEATURES --exclude-files '*/rocks/*' --exclude-files '*/ui/*' --exclude-files '*/bindings/*' --out Html --out Lcov --output-dir target/coverage --timeout 180"

[tasks.lint]
description = "Clippy across the workspace and the bindings"
run = [
  "cargo clippy --workspace --all-targets --features $STANCHION_FEATURES -- -D warnings",
  "cargo clippy -p stanchion-python -p stanchion-uniffi -p stanchion-ruby --all-targets -- -D warnings",
]

[tasks."lint:docs"]
description = "rustdoc with warnings as errors — catches broken intra-doc links"
env = { RUSTDOCFLAGS = "-D warnings" }
# A wider feature set than `$STANCHION_FEATURES`: the facade's own docs link every
# re-export it lists, and `sigstore-verify` and `index-server` are outside `full`, so
# documenting without them reports those links as broken rather than gated.
# `--all-features` is not an option — mlua's lua54/lua53/luajit/luau are mutually
# exclusive and enabling them together fails to build.
run = """
cargo doc --workspace --no-deps \
  --features $STANCHION_FEATURES,stanchion/sigstore-verify,stanchion/index-server
"""

[tasks."lint:deps"]
description = "Advisories, licences and sources over the dependency graph (deny.toml)"
run = "cargo deny --all-features check"

[tasks."lint:msrv"]
description = "Build against the declared MSRV rather than the pinned toolchain"
# `rust-version` in Cargo.toml is a claim; this is the check. It needs the MSRV
# toolchain present, which is why it is not part of `lint`.
run = "cargo +1.97.0 check --workspace --features $STANCHION_FEATURES"

[tasks.miri]
description = "Run the crates whose `unsafe` is ordinary Rust under miri"
# Excluded: `stanchion-ffi-c` (its `unsafe` *is* the C ABI, which miri cannot model —
# there is no foreign caller to model), `stanchion-lua` and `stanchion-wasm` (both
# link a C VM through FFI), and `bindings/*` for the same reason. What is left is the
# `unsafe` miri can actually say something about.
#
# `-Zmiri-disable-isolation` because the registry's own tests read manifests off the
# filesystem, and miri blocks `statx` under isolation. It permits real file access; it
# does not weaken the UB checking, which is the point of running this at all.
env = { MIRIFLAGS = "-Zmiri-disable-isolation" }
run = "cargo +nightly miri test -p stanchion-abi -p stanchion-registry"

[tasks.fuzz]
description = "Short fuzz run over the two untrusted-input front doors"
# Seeded from `fuzz/seeds/`, which matters more than it looks: random bytes almost
# never form a valid gzip member, so an unseeded `unpack` run spends its whole budget
# being rejected at the gzip magic and never reaches the tar path checks that are the
# actual subject. The seeds carry a real package, an empty archive, and manifests with
# a traversal entry and a traversal name.
#
# A real campaign runs for hours with no `-max_total_time`. This is CI's smoke length.
#
# libFuzzer writes new findings to the *first* corpus directory and only reads the
# rest, so `fuzz/corpus/` goes first and the committed seeds stay untouched.
# `fuzz/corpus/` is gitignored and so absent on a fresh checkout, which libFuzzer
# treats as a hard error rather than creating it.
run = [
  "mkdir -p fuzz/corpus/unpack fuzz/corpus/manifest",
  "cargo +nightly fuzz run unpack fuzz/corpus/unpack fuzz/seeds/unpack -- -max_total_time=60 -rss_limit_mb=4096",
  "cargo +nightly fuzz run manifest fuzz/corpus/manifest fuzz/seeds/manifest -- -max_total_time=60 -rss_limit_mb=4096",
]

[tasks."test:python"]
description = "Build the Python extension and run its suite"
dir = "bindings/python"
run = [
  "uv sync",
  "uv run maturin develop --uv",
  "uv run pytest",
  "uv run ruff check .",
  "uv run mypy",
]

[tasks."test:ruby"]
description = "Build the Ruby extension and run its suite"
dir = "bindings/ruby"
run = "rake"

[tasks."smoke:uniffi"]
description = "Generate the bindings and run the boundary through Python"
run = "./bindings/uniffi/smoke.sh"

[tasks."smoke:kotlin"]
description = "Compile the generated Kotlin and run it on the JVM"
run = "./bindings/uniffi/smoke-kotlin.sh"

[tasks.smoke]
description = "Every binding, end to end"
depends = ["smoke:uniffi", "smoke:kotlin", "test:python", "test:ruby"]

[tasks.chess]
dir = "examples/chess"
run = "godot ."

[tasks."chess:editor"]
dir = "examples/chess"
run = "godot --editor ."

[tasks."chess:lint"]
description = "Lint the chess example scripts with gdlint"
dir = "examples/chess"
run = "gdlint src/"

[tasks."chess:format"]
description = "Format the chess example scripts with gdformat"
dir = "examples/chess"
run = "gdformat src/"

[tasks."tauri:dev"]
description = "Run the example Tauri app with plugins"
dir = "examples/stanchion-editor/"
run = "pnpm tauri dev"

[tasks."android:lint"]
description = "ktlint check the Android example"
dir = "examples/kotlin-android-app"
run = "ktlint 'app/src/**/*.kt' --relative"

[tasks."android:build:ffi"]
description = "Build libstanchion_uniffi.so for arm64-v8a + x86_64 and generate UniFFI Kotlin into app/build (never committed)"
run = [
  "rustup target add aarch64-linux-android x86_64-linux-android",
  "sdkmanager --install \"ndk;$ANDROID_NDK_VERSION\" \"platforms;android-$ANDROID_API\" \"build-tools;$ANDROID_API.0.0\"",
  "cargo build -p stanchion-uniffi",
  "cargo run -q -p stanchion-uniffi --bin uniffi-bindgen -- generate --library target/debug/libstanchion_uniffi.so --language kotlin --out-dir examples/kotlin-android-app/app/build/generated/uniffi",
  "ANDROID_NDK_HOME=\"$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION\" cargo ndk -t arm64-v8a -t x86_64 -o examples/kotlin-android-app/app/build/jniLibs build -p stanchion-uniffi --release",
]

[tasks."android:build"]
description = "Assemble the Android example (bindings regenerate at build time via android:build:ffi)"
depends = ["android:build:ffi"]
dir = "examples/kotlin-android-app"
run = "gradle assembleDebug"
